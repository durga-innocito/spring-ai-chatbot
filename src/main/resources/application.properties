spring.application.name=spring-ai

# Groq Cloud API (High-Speed LLM Inference)
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:gsk_placeholder}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.7

# Tomcat Keep-Alive & Connection Timeouts (5 Minutes)
server.tomcat.connection-timeout=300000
server.tomcat.keep-alive-timeout=300000
server.tomcat.max-keep-alive-requests=1000

