name: Deploy Spring Boot AI App to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Corretto)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      # Step 3: Grant execute permission for Maven Wrapper
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step 4: Build the Spring Boot application
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # Step 5: Transfer the built artifact to AWS EC2
      - name: Copy JAR/WAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/spring-ai-0.0.1-SNAPSHOT.war"
          target: "/tmp/"
          strip_components: 1

      # Step 6: Move file to /opt/myapp and restart systemd service
      - name: Deploy and Restart Service on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mv /tmp/spring-ai-0.0.1-SNAPSHOT.war /opt/myapp/app.jar
            sudo chown ec2-user:ec2-user /opt/myapp/app.jar
            sudo systemctl restart myapp
            sudo systemctl is-active --quiet myapp && echo "Deployment Successful! Service is Active." || (echo "Service failed to start" && exit 1)
